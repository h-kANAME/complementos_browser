name: complementos-chrome

services:
  navegador:
    build:
      context: ./docker/navegador
    image: complementos-chrome-navegador
    container_name: complementos-chrome-navegador
    shm_size: "1gb"
    ports:
      - "127.0.0.1:3910:3000"
      - "127.0.0.1:3911:3001"
    environment:
      PUID: "1000"
      PGID: "1000"
      TZ: America/Argentina/Buenos_Aires
      EXTENSIONS_ROOT: /extensiones
    volumes:
      - navegador-config:/config
      - ./:/extensiones:ro
    networks:
      - escritorio
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'echo > /dev/tcp/127.0.0.1/3000'"]
      interval: 30s
      timeout: 5s
      retries: 8
      start_period: 40s
    restart: unless-stopped

networks:
  escritorio:
    driver: bridge
    ipam:
      config:
        - subnet: 10.90.20.0/24

volumes:
  navegador-config:
